name: AppImage

# Every branch builds and tests; only main publishes a release
on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'captures/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history for the version (CMakeLists.txt)
      - run: podman run --rm -v "$PWD:/workspace:Z" -w /workspace docker.io/library/ubuntu:22.04 ./appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MyPods-x86_64.AppImage
          path: MyPods-x86_64.AppImage
      # A v* tag makes a versioned release, main updates "nightly" (same as the Windows workflow)
      - name: Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: sh .github/release.sh MyPods-x86_64.AppImage
        env:
          GH_TOKEN: ${{ github.token }}
