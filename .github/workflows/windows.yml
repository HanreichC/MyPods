name: Windows MSI

# Every branch builds and tests; only main publishes a release
on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'captures/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 6.9.3
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

jobs:
  msi:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history for the version (CMakeLists.txt)

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true

      # OpenSSL, libuv and zlib from vcpkg.json; the built packages are cached between runs
      - run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('vcpkg.json') }}

      - uses: ilammy/msvc-dev-cmd@v1

      # Errors also become annotations, readable on the commit without opening the log
      - name: Build
        run: |
          pip install --quiet ninja # not on the windows-2025 image
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -eq 0) { cmake --build build 2>&1 | Tee-Object -FilePath build.log -Append }
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern 'error|CMake Error|FAILED' | Select-Object -First 15 |
              ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Self-test
        run: build\modules\magicpodscore.exe --selftest

      - name: Deploy
        run: |
          New-Item -ItemType Directory deploy\modules | Out-Null
          Copy-Item build\magicpods.exe deploy\
          Copy-Item build\modules\magicpodscore.exe deploy\modules\
          windeployqt --release --qmldir ui\src\app\qml --no-system-d3d-compiler --no-opengl-sw deploy\magicpods.exe
          # App-local VC++ runtime for both executables, so no separate redistributable install is needed
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$crt\*.dll" deploy\
          Copy-Item "$crt\*.dll" deploy\modules\

      - name: MSI
        run: |
          dotnet tool install --global wix --version 5.0.2
          # The version the app shows (CMakeLists.txt): MAJOR.MINOR plus the commits since it was set
          $v = (Select-String -Path CMakeLists.txt -Pattern '^project\(mypods VERSION (\d+\.\d+)').Matches[0].Groups[1].Value
          $base = git log -1 --format=%H '-G^project.mypods VERSION' -- CMakeLists.txt
          wix build packaging\windows\MyPods.wxs -arch x64 -d "Version=$v.$(git rev-list --count "$base..HEAD")" -d "DeployDir=$PWD\deploy" -o MyPods-x64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: MyPods-x64.msi
          path: MyPods-x64.msi

      # Every push to main is a release vX.Y.N (same as the AppImage workflow)
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: sh .github/release.sh MyPods-x64.msi
        env:
          GH_TOKEN: ${{ github.token }}
